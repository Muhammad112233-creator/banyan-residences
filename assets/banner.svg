<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Banyan Residences">
  <defs>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#ff5e62"/>
      <stop offset="20%" stop-color="#ffbb28"/>
      <stop offset="40%" stop-color="#38ef7d"/>
      <stop offset="60%" stop-color="#00c6ff"/>
      <stop offset="80%" stop-color="#b06ab3"/>
      <stop offset="100%" stop-color="#ff5e62"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-700 0" to="700 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3a26"/>
      <stop offset="100%" stop-color="#22301c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect x="14" y="14" width="1172" height="312" fill="none" stroke="#a68150" stroke-width="1" opacity="0.5"/>
  <!-- floating particles -->
  <g fill="#ccbf99">
    <circle cx="150" cy="80" r="3" opacity="0.5"><animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="120" r="4" opacity="0.4"><animate attributeName="cy" values="120;95;120" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="250" r="3" opacity="0.5"><animate attributeName="cy" values="250;230;250" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="260" r="3" opacity="0.4"><animate attributeName="cy" values="260;240;260" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="400" letter-spacing="8" fill="url(#rainbow)">BANYAN</text>
  <text x="600" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="34" letter-spacing="18" fill="#fdfbef">RESIDENCES</text>
  <line x1="480" y1="235" x2="720" y2="235" stroke="#a68150" stroke-width="1">
    <animate attributeName="x1" values="480;440;480" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="720;760;720" dur="4s" repeatCount="indefinite"/>
  </line>
  <text x="600" y="272" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" letter-spacing="3" fill="#ccbf99">A NEW CHAPTER IN REFINED LIVING</text>
  <text x="600" y="300" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" letter-spacing="2" fill="#60735c">NEXT.JS · GSAP · LENIS · TAILWIND CSS</text>
</svg>
