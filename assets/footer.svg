<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="footer">
  <defs>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#a68150"/>
      <stop offset="50%" stop-color="#60735c"/>
      <stop offset="100%" stop-color="#a68150"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-600 0" to="600 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="160" fill="#2e3a26"/>
  <path d="M0 70 Q 150 30 300 70 T 600 70 T 900 70 T 1200 70 V 160 H 0 Z" fill="url(#wave)" opacity="0.25">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 70 Q 150 30 300 70 T 600 70 T 900 70 T 1200 70 V 160 H 0 Z;
              M0 70 Q 150 105 300 70 T 600 70 T 900 70 T 1200 70 V 160 H 0 Z;
              M0 70 Q 150 30 300 70 T 600 70 T 900 70 T 1200 70 V 160 H 0 Z"/>
  </path>
  <text x="600" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#fdfbef">Crafted with care, not by chance.</text>
  <text x="600" y="98" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" letter-spacing="2" fill="#ccbf99">IF THIS TEMPLATE HELPED YOU, CONSIDER LEAVING A STAR ⭐</text>
</svg>
